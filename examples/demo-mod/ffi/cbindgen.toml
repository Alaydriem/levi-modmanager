language = "C"
cpp_compat = true
include_guard = "DEMO_FFI_H"
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
no_includes = true
autogen_warning = "/* Generated by cbindgen from examples/demo-mod/ffi. Do not edit: run `mise run demo-header`. */"
documentation = true
documentation_style = "c"
style = "both"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = ["DemoStatus"]
