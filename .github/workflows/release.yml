name: Release

on:
  push:
    tags: ['v*']

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check that every version matches the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $tooth = (Get-Content tooth.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $xmake = (Select-String -Path shim/xmake.lua -Pattern 'modVersion = "([^"]+)"').Matches[0].Groups[1].Value
          "tag=$tag tooth.json=$tooth Cargo.toml=$cargo shim/xmake.lua=$xmake"
          if ($tooth -ne $tag -or $cargo -ne $tag -or $xmake -ne $tag) {
            Write-Error "versions do not match the tag $tag"
            exit 1
          }
          "VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: jdx/mise-action@v2

      - uses: taiki-e/install-action@nextest

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('shim/xmake.lua') }}
          restore-keys: |
            xmake-

      - run: mise run test

      - run: mise run e2e

      - run: mise run header-check

      - run: mise run build-mod

      - name: Package
        shell: pwsh
        run: |
          $mod = "shim/bin/alaydriem-mod-manager"
          $name = "alaydriem-mod-manager-$env:VERSION-client-windows-x64"
          New-Item -ItemType Directory -Force dist, symbols | Out-Null
          Move-Item "$mod/alaydriem-mod-manager.pdb" symbols/
          Copy-Item LICENSE "$mod/"
          Compress-Archive -Path $mod -DestinationPath "dist/$name.zip"
          Compress-Archive -Path symbols/alaydriem-mod-manager.pdb -DestinationPath "dist/$name-pdb.zip"

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
