language = "C"
cpp_compat = true
include_guard = "AMM_HOST_H"
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
includes = ["alaydriem_mod_manager.h"]
no_includes = true
autogen_warning = "/* Generated by cbindgen from crates/amm-ffi. Do not edit: run `mise run header`. */"
documentation = true
documentation_style = "c"
style = "both"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = [
  "AmmHostFrameInput",
  "AmmHostLayer",
  "AmmHostFrame",
  "AmmHostRoute",
  "AmmHostPointerKind",
  "AmmHostConsoleCallback",
]
exclude = [
  "AmmStatus",
  "AmmMeshView",
  "AmmCursorShape",
  "AmmApi",
  "AmmLogLevel",
]
