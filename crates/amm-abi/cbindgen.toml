language = "C"
cpp_compat = true
include_guard = "ALAYDRIEM_MOD_MANAGER_H"
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
no_includes = true
autogen_warning = "/* Generated by cbindgen from crates/amm-abi. Do not edit: run `mise run header`. */"
documentation = true
documentation_style = "c"
style = "both"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = [
  "AmmStatus",
  "AmmCapability",
  "AmmScreenshotLayers",
  "AmmAcquireOutcome",
  "AmmAcquireResult",
  "AmmEventKind",
  "AmmEvent",
  "AmmVertex",
  "AmmSamplerKind",
  "AmmDrawCmd",
  "AmmTextureDelta",
  "AmmMeshView",
  "AmmUiEventKind",
  "AmmUiEvent",
  "AmmFrameInput",
  "AmmCursorShape",
  "AmmFrameOutput",
  "AmmCallbacks",
  "AmmHandle",
  "AmmLogLevel",
  "AmmApi",
]
